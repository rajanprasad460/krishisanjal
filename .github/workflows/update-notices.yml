name: Update AKC Notices

on:
  workflow_dispatch:

  schedule:
    # Daily at 6:00 AM Nepal Time
    # Nepal UTC+5:45 = 00:15 UTC
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  update-notices:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-nep \
            poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4 \
            pypdf \
            pillow \
            pytesseract \
            pdf2image \
            google-genai \
            python-dotenv

      - name: Verify Tesseract
        run: |
          tesseract --version
          tesseract --list-langs

      - name: Scrape new notices
        run: python scrapper.py

      - name: Download new files
        run: python downloader.py

      - name: Extract OCR/Text
        run: python extract.py

      - name: AI Summarize
        run: python aisummarize.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add notices.json
          git add downloads
          git add texts

          git diff --cached --quiet || \
          git commit -m "Auto update notices"

      - name: Push changes
        run: git push